# Production: every secret is mandatory and comes from the environment. No defaults on purpose.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS}
  credentials-required: true

jwt:
  private-key: ${JWT_PRIVATE_KEY_PEM}
  public-key: ${JWT_PUBLIC_KEY_PEM}
  generate-missing-keys: false

logging:
  level:
    root: INFO
