# The datasource is supplied at runtime by the test database abstraction
# (Testcontainers, or TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD).
spring:
  flyway:
    clean-disabled: true

cors:
  allowed-origins: http://localhost:3000

google:
  client-id: test-client-id
  client-secret: test-client-secret

logging:
  level:
    root: WARN
    com.pennypincher.pro: INFO
