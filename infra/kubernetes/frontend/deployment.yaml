apiVersion: apps/v1
kind: Deployment
metadata:
  name: pennypincher-frontend
  namespace: pennypincher-pro
  labels:
    app.kubernetes.io/name: pennypincher-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: pennypincher-pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pennypincher-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pennypincher-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: pennypincher-pro
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/josanchezag/pennypincher-pro-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_ORIGIN
              value: https://api.pennypincher.yourdomain.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
