apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pennypincher-frontend
  namespace: pennypincher-pro
  labels:
    app.kubernetes.io/name: pennypincher-frontend
    app.kubernetes.io/part-of: pennypincher-pro
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pennypincher.yourdomain.com
      secretName: pennypincher-frontend-tls
  rules:
    - host: pennypincher.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pennypincher-frontend
                port:
                  name: http
