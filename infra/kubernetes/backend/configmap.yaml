apiVersion: v1
kind: ConfigMap
metadata:
  name: pennypincher-backend
  namespace: pennypincher-pro
  labels:
    app.kubernetes.io/name: pennypincher-backend
    app.kubernetes.io/part-of: pennypincher-pro
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  DATABASE_URL: jdbc:postgresql://pennypincher-db:5432/pennypincher
  CORS_ALLOWED_ORIGINS: https://pennypincher.yourdomain.com
  GOOGLE_ALLOWED_REDIRECT_URIS: https://pennypincher.yourdomain.com/auth.html
  # Frontend and API share the registrable domain, so the refresh cookie can stay SameSite=Strict.
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: Strict
