apiVersion: apps/v1
kind: Deployment
metadata:
  name: pennypincher-backend
  namespace: pennypincher-pro
  labels:
    app.kubernetes.io/name: pennypincher-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: pennypincher-pro
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pennypincher-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pennypincher-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: pennypincher-pro
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/josanchezag/pennypincher-pro-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pennypincher-backend
            - secretRef:
                name: pennypincher-backend
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pennypincher-db
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pennypincher-db
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
