# Local development stack: PostgreSQL 16, the backend API and Adminer.
# Usage (from infra/docker): docker compose --env-file .env.local up -d --build
# The Flutter frontend is optional: add `--profile frontend` (needs ../../../pennypincher-pro-frontend).
name: pennypincher-pro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pennypincher}
      POSTGRES_USER: ${POSTGRES_USER:-pennypincher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pennypincher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: pennypincher-pro-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pennypincher}
      DATABASE_USERNAME: ${POSTGRES_USER:-pennypincher}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pennypincher}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_REDIRECT_URIS: ${GOOGLE_ALLOWED_REDIRECT_URIS:-http://localhost:3000/auth.html}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      # Generated local RSA keys live in a named volume so they survive container recreation.
      JWT_LOCAL_KEY_DIR: /app/keys
    volumes:
      - jwtkeys:/app/keys
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  adminer:
    image: adminer:4
    restart: unless-stopped
    # The image listens on [::] by default, which fails on hosts without IPv6.
    command: ["php", "-S", "0.0.0.0:8080", "-t", "/var/www/html"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8090}:8080"

  frontend:
    profiles: ["frontend"]
    build:
      context: ../../../pennypincher-pro-frontend
      args:
        API_ORIGIN: ${FRONTEND_API_ORIGIN:-http://localhost:${BACKEND_PORT:-8080}}
        API_BASE_URL: ${FRONTEND_API_ORIGIN:-http://localhost:${BACKEND_PORT:-8080}}/api/v1
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        DEV_LOGIN: ${FRONTEND_DEV_LOGIN:-true}
    image: pennypincher-pro-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
  jwtkeys:
